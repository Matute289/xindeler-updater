[package]
name = "xindeler-updater"
description = "Provides automatic updates for Xindeler."
version = "0.17.0"
edition = "2024"
publish = false
default-run = "xindeler-updater"
exclude = ["assets/fonts/GoNotoCurrent.ttf"]

license = "GPL-3.0"
homepage = "https://xindeler.com"
repository = "https://github.com/Matute289/xindeler-updater"

[package.metadata.nix]
build = true
app = true

[package.metadata.nix.desktopFile]
name = "Xindeler Updater"
icon = "./assets/icons/logo.ico"

[badges]
maintenance = { status = "actively-developed" }

[features]
# Windows cannot bundle ssl by default and as such this feature exists
# to bundle ssl in CI.
bundled = ["openssl-sys"]
bundled_font = []

[dependencies]
veloren-serverbrowser-api = "0.4.0"
# xindeler-new-horizon's own fork of the query-server protocol - switched from the
# upstream crates.io `veloren-query-server` so we can use the `Identity` request it
# added (NH query-server-identity, PR #313) to confirm a manually-added server is
# actually running Xindeler rather than vanilla Veloren or an unrelated fork. Pinned
# to a commit rather than a branch for reproducible builds; bump deliberately.
xindeler-query-server = { package = "xindeler-query-server", git = "ssh://git@github.com/Matute289/xindeler-new-horizon.git", rev = "22f6e55abccf8fe501a69b37152035cff12a72f2", default-features = false, features = [
    "client",
] }

# Cli
clap = { version = "4.5.21", features = ["cargo", "derive"] }
indicatif = "0.18"
rustyline = "17"
colored = "3"

# UI
iced = { version = "0.12.1", features = [
    "tokio",
    "image",
    "debug",
    "advanced",
] }
rfd = "0.17.2"
# i18n: locale files live in client/locales/, loaded at compile time by the
# `rust_i18n::i18n!` macro in main.rs. English is the fallback.
rust-i18n = "3"

# Logging
tracing = { workspace = true }
tracing-futures = { workspace = true }
tracing-subscriber = { workspace = true }
termcolor = { workspace = true }
tracing-appender = { workspace = true }
tracing-log = { workspace = true }
regex = { workspace = true }
# Networking
reqwest = { workspace = true, features = ["json"] }

# Parsing
pulldown-cmark = "0.13"
strip_markdown = "0.2.0"
html2text = "0.15"
serde = { workspace = true }
semver = "1"
rss = "2.0.7"
ron = { workspace = true }
remozipsy = "0.2.0"
crc32fast = "1.4.2"
flate2 = "1.0"
url = { workspace = true }
# Other
image = { version = "0.25.5", default-features = false, features = [
    "ico",
    "jpeg",
    "png",
    "webp",
] }
tokio = { workspace = true, features = [
    "macros",
    "io-util",
    "process",
    "net",
    "sync",
] }
tokio-stream = { version = "0.1.6", features = ["io-util"] }
futures-util = "0.3.15"
derive_more = { workspace = true }
find_folder = "0.3.0"
lazy_static = { workspace = true }
thiserror = { workspace = true }
bytesize = { workspace = true }
bytes = { workspace = true }
opener = "0.8"
dirs = { package = "dirs-next", version = "2.0.0" }
rand = "0.9"
chrono = { workspace = true }
country-parser = "0.1.1"
# Launcher self-update (client/src/launcher_update.rs): archive-zip for macOS's .zip
# release, archive-tar/compression-flate2 for Linux's .tar.gz release. Windows ships a
# plain .exe installer (no archive), applied via windows.rs instead.
# default-features off + "rustls" on: self_update's default pulls in reqwest's
# native-tls (openssl-sys), which needs libssl-dev to build - our own reqwest is
# already rustls-only (see reqwest below) specifically to avoid that system dependency
# in CI, so this stays consistent with it.
self_update = { version = "0.42", default-features = false, features = [
    "archive-zip",
    "archive-tar",
    "compression-flate2",
    "rustls",
] }
sha2 = "0.10"
hex = "0.4"

# bundle all the things!
openssl-sys = { version = "0.9", features = ["vendored"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_UI",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }

[build-dependencies]
winresource = "0.1.15"

[dev-dependencies]
tempfile = "3"
# Enables the `server` feature on top of `xindeler-query-server` above (same git
# source, unified by Cargo), only for tests - lets `net::ping`'s tests spin up a real
# `QueryServer` to verify the `Identity` check end-to-end instead of trusting the
# crate's own examples alone.
xindeler-query-server = { package = "xindeler-query-server", git = "ssh://git@github.com/Matute289/xindeler-new-horizon.git", rev = "22f6e55abccf8fe501a69b37152035cff12a72f2", default-features = false, features = [
    "server",
] }
